<section class="contact section">

    <div class="container">

        <span class="section-tag">Contact Us</span>

        <h2 class="section-title">Get in Touch</h2>

        <p class="section-description">
            We'd love to hear from you. Complete the form below and we'll get back to you as soon as possible.
        </p>

        <form class="contact-form">

            <div class="form-group">
                <label for="name">Full Name</label>
                <input type="text" id="name" name="name" placeholder="Enter your full name" required>
            </div>

            <div class="form-group">
                <label for="phone">Phone Number</label>
                <input type="tel" id="phone" name="phone" placeholder="Enter your phone number" required>
            </div>

            <div class="form-group">
                <label for="email">Email Address</label>
                <input type="email" id="email" name="email" placeholder="Enter your email">
            </div>

            <div class="form-group">
                <label for="subject">Subject</label>
                <input type="text" id="subject" name="subject" placeholder="What is your enquiry about?">
            </div>

            <div class="form-group">
                <label for="message">Message</label>
                <textarea id="message" name="message" rows="6" placeholder="Write your message..." required></textarea>
            </div>

            <button type="submit" class="btn-primary">
                Send Message
            </button>

        </form>

    </div>

</section>
